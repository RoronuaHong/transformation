name: sync-gate

on:
  push:
    paths:
      - "subtitle_pipeline/**"
      - "transform/lib/content.ts"
      - ".github/workflows/sync-gate.yml"
  pull_request:
    paths:
      - "subtitle_pipeline/**"
      - "transform/lib/content.ts"
      - ".github/workflows/sync-gate.yml"

jobs:
  sync-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subtitle_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Sync gate (CI)
        run: python sync_gate.py --ci
