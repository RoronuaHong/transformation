# LLM profiles for subtitle_pipeline (chat = polish/summary, translate = subtitles)
# Copy to llm.yaml to customize. Secrets stay in env — never commit keys.
#
# Switch:
#   --llm-profile tokenhub
#   set VITUAL_LLM_PROFILE=hybrid
#
# TokenHub / 腾讯云 (same env as Claude Code / Cursor Agent):
#   ANTHROPIC_BASE_URL=https://tokenhub.tencentmaas.com
#   ANTHROPIC_AUTH_TOKEN=YOUR_TOKEN_HERE
#   ANTHROPIC_MODEL=hy3
#
# Other sites:
#   Singapore: https://tokenhub-intl.tencentcloudmaas.com
#   US:        https://tokenhub-us.tencentcloudmaas.com

# ── OpenRouter（免费模型，OpenAI 兼容）──
#   控制台 https://openrouter.ai/workspaces/default/keys 创建 key，得到 sk-or-... 填到 OPENROUTER_API_KEY
#   免费模型列表公开：GET https://openrouter.ai/api/v1/models （pricing.prompt/completion == "0"）
#   接入端点：https://openrouter.ai/api/v1 （Bearer 鉴权；可附带 HTTP-Referer / X-Title 头，可选）
# OPENROUTER_API_KEY=sk-or-xxxxxxxx
# OPENROUTER_MODEL=<免费模型 id，如 nvidia/nemotron-3.5-lightning:free>

profile: local

profiles:
  local:
    chat:
      provider: ollama
      model: gemma4:e2b
      base_url: http://127.0.0.1:11434
      temperature: 0.2
    translate:
      provider: ollama
      model: translategemma:4b
      base_url: http://127.0.0.1:11434
      temperature: 0.2

  # 腾讯 TokenHub hy3（OpenAI 协议优先，失败再试 Anthropic Messages）
  tokenhub:
    chat:
      provider: tokenhub
      model: hy3
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
      temperature: 0.2
    translate:
      provider: tokenhub
      model: hy3
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
      temperature: 0.2

  # 强制走 Anthropic Messages（与 Claude Code 同协议）
  tokenhub_anthropic:
    chat:
      provider: tokenhub
      model: hy3
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
      prefer_anthropic: true
    translate:
      provider: tokenhub
      model: hy3
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
      prefer_anthropic: true

  openai:
    chat:
      provider: openai_compat
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    translate:
      provider: openai_compat
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY

  hybrid:
    # 总结/润色走腾讯 hy3；字幕翻译仍本地 translategemma
    chat:
      provider: tokenhub
      model: hy3
      base_url: ${ANTHROPIC_BASE_URL}
      api_key_env: ANTHROPIC_AUTH_TOKEN
    translate:
      provider: ollama
      model: translategemma:4b
      base_url: http://127.0.0.1:11434

  # 兜底链：本地(免费/离线) → OpenRouter 免费(多模型顺延) → 腾讯 TokenHub(付费,最后兜底)
  # 任一失败自动顺延下家；全部失败才抛错。切换：set VITUAL_LLM_PROFILE=openrouter_chain
  openrouter_chain:
    chat:
      provider: ollama
      model: gemma4:e2b
      base_url: http://127.0.0.1:11434
      fallback:
        - provider: openai_compat
          model: ${OPENROUTER_MODEL}                       # 首选(默认 nvidia/nemotron-3.5-lightning:free，可在 .env 覆盖)
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY                    # sk-or-...
        - provider: openai_compat
          model: nvidia/nemotron-3-super-120b-a12b:free      # 实测 5/5, avg 10.3s(最快)
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY
        - provider: openai_compat
          model: nvidia/nemotron-3-ultra-550b-a55b:free     # 实测 5/5, avg 12.3s
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY
        - provider: tokenhub
          model: hy3                                         # 付费,作为最后兜底
          base_url: ${ANTHROPIC_BASE_URL}
          api_key_env: ANTHROPIC_AUTH_TOKEN
    translate:
      provider: ollama
      model: translategemma:4b
      base_url: http://127.0.0.1:11434
      fallback:
        - provider: openai_compat
          model: ${OPENROUTER_MODEL}
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY
        - provider: openai_compat
          model: nvidia/nemotron-3-super-120b-a12b:free
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY
        - provider: openai_compat
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          base_url: https://openrouter.ai/api/v1
          api_key_env: OPENROUTER_API_KEY
        - provider: tokenhub
          model: hy3
          base_url: ${ANTHROPIC_BASE_URL}
          api_key_env: ANTHROPIC_AUTH_TOKEN
